# Run with:
# mkdir -p /tmp/villas-fmu/{grid,pv_bus675,pv_bus680}
# cd etc/labs && ../../build/src/villas-node fmu_3pcc.conf

nodes = {
    # Simulation
    ieee13bus = {
        type = "fmu"
        fmu_path = "grid_3pcc.fmu"
        fmu_unpack_path = "/tmp/villas-fmu/grid"
        fmu_writing_turn = false
        stop_time = 0.1
        start_time = 0.0
        step_size = 0.00001

        in = {
            signals = (
                {name = "In1", type = "float"},
                {name = "In2", type = "float"},
                {name = "In3", type = "float"},
                {name = "In4", type = "float"},
                {name = "In5", type = "float"},
                {name = "In6", type = "float"}
            )
        }

        out = {
            signals = (
                {name = "Out1", type = "float"},
                {name = "Out2", type = "float"},
                {name = "Out3", type = "float"},
                {name = "Out4", type = "float"},
                {name = "Out5", type = "float"},
                {name = "Out6", type = "float"}
            )
        }
    }
    # PV connected at bus 675
    pv_bus675 = {
        type = "fmu"
        fmu_path = "pv.fmu"
        fmu_unpack_path = "/tmp/villas-fmu/pv_bus675"
        fmu_writing_turn = true
        stop_time = 0.1
        start_time = 0.0
        step_size = 0.00001

        in = {
            signals = (
                {name = "In1", type = "float"},
                {name = "In2", type = "float"},
                {name = "In3", type = "float"}
            )
        }

        out = {
            signals = (
                {name = "Out1", type = "float"},
                {name = "Out2", type = "float"},
                {name = "Out3", type = "float"}
            )
        }
    }
    # PV connected at bus 680
    pv_bus680 = {
        type = "fmu"
        fmu_path = "pv.fmu"
        fmu_unpack_path = "/tmp/villas-fmu/pv_bus680"
        fmu_writing_turn = true
        stop_time = 0.1
        start_time = 0.0
        step_size = 0.00001

        in = {
            signals = (
                {name = "In1", type = "float"},
                {name = "In2", type = "float"},
                {name = "In3", type = "float"}
            )
        }

        out = {
            signals = (
                {name = "Out1", type = "float"},
                {name = "Out2", type = "float"},
                {name = "Out3", type = "float"}
            )
        }
    }
}

paths = (
    {
        in = "ieee13bus.data[0-2]"
        out = "pv_bus675"
        hooks = ( { type = "print", output = "pv_bus675_out.dat" })
    },
    {
        in = "pv_bus675"
        out = "ieee13bus.data[0-2]"
        hooks = ( { type = "print" })
    },
    {
        in = "ieee13bus.data[3-5]"
        out = "pv_bus680"
        hooks = ( { type = "print" })
    },
    {
        in = "pv_bus680"
        out = "ieee13bus.data[3-5]"
        hooks = ( { type = "print" })
    }
)

logging = {
    level = "debug"
}
